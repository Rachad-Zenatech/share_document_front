image: node:22

pipelines:
  branches:
    main:
      - step:
          name: Build Frontend
          caches:
            - node
          script:
            - |
              if [ -n "$GIT_CRYPT_KEY" ]; then
                echo "Unlocking git-crypt encrypted files..."
                apt-get update && apt-get install -y git-crypt
                echo "$GIT_CRYPT_KEY" | base64 -d > /tmp/git-crypt-key
                git-crypt unlock /tmp/git-crypt-key
                rm -f /tmp/git-crypt-key
                echo "Files unlocked successfully."
              else
                echo "GIT_CRYPT_KEY variable not set, skipping git-crypt unlock."
              fi
            - npm ci || npm install
            - npm run build
          artifacts:
            - dist/**
      - step:
          name: Deploy to AWS (S3 & CloudFront)
          trigger: manual
          deployment: production
          script:
            - echo "Deploying to AWS S3 & CloudFront..."
            - pipe: atlassian/aws-s3-deploy:1.6.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: $AWS_REGION
                S3_BUCKET: $S3_BUCKET_NAME
                LOCAL_PATH: 'dist'
            - pipe: atlassian/aws-cloudfront-invalidate:0.7.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: $AWS_REGION
                DISTRIBUTION_ID: $CLOUDFRONT_DISTRIBUTION_ID